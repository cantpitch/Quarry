name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # No SQL Server here: the integration tests skip themselves. Docker on hosted
      # Windows/macOS runners cannot run the Linux SQL Server image, so don't try.
      QUARRY_NO_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      # The Platform tests use the real OS keychain, which CI machines don't have unlocked.
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "Category!=Platform" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  integration:
    name: Integration tests (SQL Server 2022)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that only exists for this job.
          MSSQL_SA_PASSWORD: "Quarry-CI-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Quarry-CI-Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      QUARRY_TEST_CONNECTION: "Server=localhost,1433;User ID=sa;Password=Quarry-CI-Passw0rd!;TrustServerCertificate=true;Connect Timeout=30"
      QUARRY_UI_SNAPSHOTS: ${{ github.workspace }}/ui-snapshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release -warnaserror

      - name: Test against SQL Server
        run: dotnet test --configuration Release --no-build --filter "Category!=Platform" --logger "trx" --results-directory TestResults

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ui-snapshots
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: TestResults
